<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Map · Stoke Feast</title>
  <meta name="description" content="Spin the globe and find slacklining and highlining videos by the place they were filmed.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M5 40 Q50 70 95 40' stroke='%23d4a72c' stroke-width='10' fill='none' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Work+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="map-page">
  <a class="skip" href="#spot-panel">Skip to the list of spots</a>

  <header class="site-header" id="site-header">
    <a class="brand" href="index.html" aria-label="Stoke Feast home">
      <svg viewBox="0 0 48 20" aria-hidden="true"><path d="M2 4 Q24 18 46 4" /></svg>
      <span>Stoke Feast</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="map.html" aria-current="page">Map</a>
      <a href="channels.html">Channels</a>
      <a href="timeline.html">Timeline</a>
    </nav>
  </header>

  <main id="main" class="map-main">
    <div id="globe" class="globe" role="region" aria-label="Globe of filming spots. Drag to spin, scroll or pinch to zoom."></div>

    <aside class="spot-panel" id="spot-panel" aria-labelledby="panel-title">
      <div class="panel-head">
        <p class="eyebrow">The Map</p>
        <h1 id="panel-title">Where the lines are</h1>
        <p class="panel-stats" id="panel-stats"></p>
        <p class="panel-hint">Drag to spin, scroll to zoom. Bigger dots hold more videos. Click one to open the spot.</p>
        <button class="panel-toggle" id="panel-toggle" type="button" aria-expanded="true" aria-controls="spot-lists">
          <span class="when-open">Hide spots</span><span class="when-closed">Show all spots</span>
        </button>
      </div>
      <div class="spot-lists" id="spot-lists">
        <ol class="spot-list" id="spot-list"></ol>
        <div id="unpinned"></div>
      </div>
    </aside>

    <button class="reset-view" id="reset-view" type="button">Whole world</button>
  </main>

  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="videos.js"></script>
  <script src="spots.js"></script>
  <script src="site.js"></script>
  <script src="map.js"></script>
</body>
</html>
