<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feast · Hand-picked slackline videos</title>
  <meta name="description" content="A hand-curated collection of the best slacklining videos, with a focus on highlining.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M5 40 Q50 70 95 40' stroke='%23f97316' stroke-width='8' fill='none'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <svg class="line-art" viewBox="0 0 400 60" aria-hidden="true">
        <path d="M0 10 Q200 50 400 10" />
      </svg>
      <h1>Feast</h1>
      <p class="tagline">Hand-picked slackline videos, with a soft spot for highlining.</p>
    </div>
  </header>

  <main>
    <section id="featured-section" aria-labelledby="featured-title">
      <h2 id="featured-title">Featured</h2>
      <div id="featured" class="grid featured"></div>
    </section>

    <section aria-labelledby="browse-title">
      <h2 id="browse-title">Browse</h2>

      <nav class="disciplines" id="disciplines" aria-label="Disciplines"></nav>
      <p class="discipline-blurb" id="blurb"></p>

      <div class="filters">
        <label>Level
          <select id="level"></select>
        </label>
        <label>Type
          <select id="type"></select>
        </label>
        <label class="search">Search
          <input id="search" type="search" placeholder="e.g. rigging, leash, falls">
        </label>
      </div>

      <p class="count" id="count" aria-live="polite"></p>
      <div id="results" class="grid"></div>
    </section>
  </main>

  <footer>
    <p>Videos belong to their creators and play from YouTube or Vimeo. Know a great one? Get in touch.</p>
  </footer>

  <dialog id="player" aria-label="Video player">
    <div class="player-frame" id="player-frame"></div>
    <div class="player-info">
      <h3 id="player-title"></h3>
      <p id="player-desc"></p>
    </div>
    <button class="close" id="player-close" aria-label="Close">×</button>
  </dialog>

  <script src="videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
