<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highline banner · rough motion preview</title>
  <style>
    :root {
      --bark: #2a2019; --soil: #3e3024; --moss: #4d4a23; --lichen: #8b8a4c;
      --mustard: #d4a72c; --rust: #b8572f; --sand: #e7ddc7; --paper: #f3ecdc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--sand); color: var(--bark);
           font: 16px/1.5 "Work Sans", system-ui, sans-serif; }
    .fake-hero { height: 260px; background: var(--soil) url("images/home/image1.webp") center/cover; }
    .note { max-width: 760px; margin: 1.5rem auto; padding: 0 1rem; }
    .note h1 { font-family: Georgia, serif; font-size: 1.4rem; margin: 0 0 .3rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 1rem 1.6rem; align-items: center; margin-top: .8rem; font-size: .92rem; }
    .controls label { display: flex; gap: .5rem; align-items: center; }

    /* ---------- The band (replaces the old discipline marquee) ---------- */
    .highline-band {
      background: var(--mustard);
      border-block: 2px solid var(--bark);
      overflow: hidden;
      line-height: 0;
    }
    .highline-band svg { display: block; width: 100%; height: 200px; }
    .hl-main   { fill: none; stroke: var(--bark); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .hl-backup { fill: none; stroke: var(--rust); stroke-width: 2; stroke-linecap: round; }
    .hl-leash  { fill: none; stroke: var(--rust); stroke-width: 1.8; stroke-linecap: round; }
    .hl-ring   { fill: none; stroke: var(--bark); stroke-width: 1.6; }
    .hl-body   { fill: none; stroke: var(--bark); stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
    .hl-head   { fill: var(--bark); }
    .debug .hl-joint { fill: var(--paper); stroke: var(--bark); stroke-width: 1; }
    .hl-joint { display: none; }
    .debug .hl-joint { display: inline; }
  </style>
</head>
<body>
  <div class="fake-hero" aria-hidden="true"></div>

  <div class="highline-band" aria-hidden="true">
    <svg id="highline" preserveAspectRatio="none"></svg>
  </div>

  <div class="note">
    <h1>Rough motion preview: highliner banner</h1>
    <p>Stand-in for the strip under the rotating photos. Only the motion is being judged here; colours, line weights and the figure's style get polished later.</p>
    <div class="controls">
      <label>Speed <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1"> <span id="speed-val">1×</span></label>
      <label><input id="debug" type="checkbox"> Show joints</label>
      <label><input id="pause" type="checkbox"> Pause</label>
    </div>
  </div>

<script>
/* Highliner banner: a stick figure walks a highline (main line + backup taped
   beneath it). Everything is computed each frame, so the line deflects under the
   walker and swings slowly as the steps nudge it. No libraries. */
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("highline");
  const H = 200;
  let W = svg.clientWidth || 1200;

  // ---------- tunables ----------
  const CFG = {
    anchorY: 72,        // line height at the (off-screen) anchors
    staticSag: 16,      // sag of the unloaded line at mid-span
    loadSag: 30,        // extra sag at mid-span with the walker on it
    tapeGap: [80, 155], // distance between backup tapes, min/max (irregular)
    backupDrop: [12, 34], // how far each backup loop hangs below, min/max
    stepLen: [22, 32],  // length of each step, min/max
    stepTime: [0.8, 1.45], // seconds per step, min/max (irregular tempo)
    pauseChance: 0.16,  // chance of stopping to settle after a step
    pauseTime: [0.6, 1.8],
    thigh: 25, shin: 25,
    torso: 32, neck: 4, headR: 7.5,
    upperArm: 18, foreArm: 16,
  };
  let speedMul = 1, paused = false;

  function el(tag, cls, parent) {
    const e = document.createElementNS(NS, tag);
    if (cls) e.setAttribute("class", cls);
    (parent || svg).appendChild(e);
    return e;
  }

  const gBackup = el("g");
  const backupPath = el("path", "hl-backup", gBackup);
  const mainPath = el("path", "hl-main");
  const leash = el("path", "hl-leash");
  const ring = el("circle", "hl-ring"); ring.setAttribute("r", 2.6);
  const gFar = el("g");
  const farLeg = el("polyline", "hl-body", gFar);
  const farFoot = el("line", "hl-body", gFar);
  const farArm = el("polyline", "hl-body", gFar);
  const gNear = el("g");
  const nearLeg = el("polyline", "hl-body", gNear);
  const nearFoot = el("line", "hl-body", gNear);
  const torso = el("polyline", "hl-body", gNear);
  const head = el("circle", "hl-head", gNear);
  const nearArm = el("polyline", "hl-body", gNear);
  const joints = [];
  for (let i = 0; i < 9; i++) { const j = el("circle", "hl-joint"); j.setAttribute("r", 1.8); joints.push(j); }

  let tapes = [], drops = [];
  function layout() {
    W = svg.clientWidth || W;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    // Tape points are fixed in x (they're stuck to the webbing) and spaced
    // unevenly, with uneven loops, so it looks rigged by hand. Tape not drawn.
    tapes = []; drops = [];
    const A = spanA(), B = spanB(), rnd = rng(7);
    for (let x = A; x < B; x += between(rnd, CFG.tapeGap)) {
      tapes.push({ x });
      drops.push(between(rnd, CFG.backupDrop));
    }
  }
  // small seeded random generator, so every visit looks the same
  function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  const between = (r, [a, b]) => a + r() * (b - a);
  const spanA = () => -0.18 * W - 80;
  const spanB = () => 1.18 * W + 80;

  // ---------- line shape ----------
  // Unloaded line: shallow parabola. Load: a V with its apex at the walker,
  // rounded off so the webbing between the feet isn't a sharp kink.
  function lineY(x, xw, d) {
    const A = spanA(), B = spanB(), L = B - A;
    const u = (x - A) / L;
    const stat = CFG.staticSag * 4 * u * (1 - u);
    const l = (x - A) / (xw - A), r = (B - x) / (B - xw);
    const k = 0.035;
    const soft = -k * Math.log(Math.exp(-l / k) + Math.exp(-r / k));
    const norm = Math.min(1, soft / (1 - k * Math.LN2));
    return CFG.anchorY + stat + d * Math.max(0, norm);
  }
  function lineSlope(x, xw, d) { return (lineY(x + 1, xw, d) - lineY(x - 1, xw, d)) / 2; }

  // ---------- helpers ----------
  const smooth = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
  const rad = deg => deg * Math.PI / 180;
  const pts = arr => arr.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  // Slow, never-repeating wobble for balance corrections.
  const noise = (t, s) => Math.sin(t * 0.73 + s) * 0.55 + Math.sin(t * 1.37 + s * 2.1) * 0.3 + Math.sin(t * 2.71 + s * 3.7) * 0.15;

  // Two-bone IK: returns the knee point, bending forward (+x).
  function knee(hip, ankle) {
    const a = CFG.thigh, b = CFG.shin;
    const dx = ankle[0] - hip[0], dy = ankle[1] - hip[1];
    let d = Math.hypot(dx, dy);
    d = Math.min(d, a + b - 0.01);
    const base = Math.atan2(dy, dx);
    const ang = Math.acos((a * a + d * d - b * b) / (2 * a * d));
    const t = base - ang; // minus = knee out in front for left-to-right walking
    return [hip[0] + a * Math.cos(t), hip[1] + a * Math.sin(t)];
  }

  // ---------- bounce: a damped spring kicked at each footfall ----------
  // A long line swings slowly (well under 1 Hz) and each step adds only a nudge.
  let bounce = 0, bounceV = 0;
  const OMEGA = 2 * Math.PI * 0.42, ZETA = 0.12;

  // ---------- gait: footfalls with uneven lengths and timing ----------
  // plants[k] = where footfall k lands. During step n the stance foot is on
  // plants[n] and the other foot swings from plants[n-1] to plants[n+1].
  const gaitRnd = rng(11);
  let plants, n, p, stepDur, hold;
  function startCrossing(x0) {
    plants = [x0 - 30, x0 - 4];
    n = 1; p = 0; hold = 0;
    stepDur = between(gaitRnd, CFG.stepTime);
  }
  function plant(k) {
    while (plants.length <= k) plants.push(plants[plants.length - 1] + between(gaitRnd, CFG.stepLen));
    return plants[k];
  }
  startCrossing(-70);
  let s = -70;   // walker distance (hip x)
  let t = 0, last = performance.now();
  const manual = new URLSearchParams(location.search).has("manual");
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt);
    if (!manual) requestAnimationFrame(frame);
  }
  window.hlStep = step; // used to render recording frames one at a time
  function step(dt) {
    if (paused) dt = 0;
    dt *= speedMul;
    t += dt;
    // advance the gait: walk a step, sometimes stop and settle, repeat
    if (hold > 0) hold -= dt;
    else {
      p += dt / stepDur;
      if (p >= 1) {
        p -= 1; n += 1;
        stepDur = between(gaitRnd, CFG.stepTime);
        bounceV += between(gaitRnd, [1.5, 4]);       // gentle nudge on footfall
        if (gaitRnd() < CFG.pauseChance) { hold = between(gaitRnd, CFG.pauseTime); p = 0; }
      }
    }
    const pe = smooth(p) * 0.6 + p * 0.4;   // hips surge a little mid-step
    s = (plant(n - 1) + plant(n)) / 2 + ((plant(n + 1) - plant(n - 1)) / 2) * pe;
    if (s > W + 70) { startCrossing(-70); s = -70; }

    const acc = -OMEGA * OMEGA * bounce - 2 * ZETA * OMEGA * bounceV;
    bounceV += acc * dt; bounce += bounceV * dt;

    // Fade the load in/out at the edges so the loop restart is invisible.
    const onScreen = smooth((s + 70) / 160) * smooth((W + 70 - s) / 160);
    const A = spanA(), B = spanB(), u = (s - A) / (B - A);
    const d = (CFG.loadSag * 4 * u * (1 - u) + 6 + bounce) * onScreen;
    const Y = x => lineY(x, s, d);

    // Feet: stance foot planted, swing foot travels 2 steps with a low lift.
    const stanceX = plant(n);
    const q = smooth((p - 0.12) / 0.76);
    const swingX = plant(n - 1) + (plant(n + 1) - plant(n - 1)) * q;
    const lift = 4.5 * Math.sin(Math.PI * q);
    const feet = [
      [stanceX, Y(stanceX) - 2.5],
      [swingX,  Y(swingX) - 2.5 - lift],
    ];
    // Which foot is the near one alternates every step.
    const nearIsStance = n % 2 === 0;

    // Balance: slow corrections. Torso sways a touch, arms counter it.
    const bal = noise(t, 1.3);
    const bal2 = noise(t * 1.4, 4.1);

    // Hips: soft knees, tiny bob at mid-stance, slight sideways weight shift
    const hipY = Y(s) - 47 + 1.2 * Math.cos(2 * Math.PI * p);
    const hip = [s + 1.5 * bal, hipY];
    const lean = rad(3 + 2.2 * bal);
    const neck = [hip[0] + CFG.torso * Math.sin(lean), hip[1] - CFG.torso * Math.cos(lean)];
    const headC = [neck[0] + (CFG.neck + CFG.headR) * Math.sin(lean * 1.4), neck[1] - (CFG.neck + CFG.headR) * Math.cos(lean * 1.4)];
    const shoulder = [hip[0] + (CFG.torso - 4) * Math.sin(lean), hip[1] - (CFG.torso - 4) * Math.cos(lean)];

    // Arms: raised, elbows about shoulder height, hands near head height,
    // like the reference. Angles from straight up, + = forward.
    function arm(upperDeg, foreDeg) {
      const e = [shoulder[0] + CFG.upperArm * Math.sin(rad(upperDeg)), shoulder[1] - CFG.upperArm * Math.cos(rad(upperDeg))];
      const h = [e[0] + CFG.foreArm * Math.sin(rad(foreDeg)), e[1] - CFG.foreArm * Math.cos(rad(foreDeg))];
      return [shoulder, e, h];
    }
    // Elbows hinge on their own: a slow drift plus small, quicker tweaks.
    const nUp = 72 - 13 * bal - 6 * bal2, fUp = -70 - 13 * bal + 6 * bal2;
    const nElbow = -55 + 20 * noise(t * 0.9, 7.3) + 6 * noise(t * 2.8, 2.2);
    const fElbow = 58 + 20 * noise(t * 0.8, 9.1) + 6 * noise(t * 3.1, 5.6);
    const near = arm(nUp, nUp + nElbow);
    const far  = arm(fUp, fUp + fElbow);

    function leg(ankle) {
      const k = knee(hip, ankle);
      return { pts: [hip, k, ankle], foot: [ankle[0] - 3, ankle[1] + 1.5, ankle[0] + 6, ankle[1] + 1.5 + 6 * lineSlope(ankle[0], s, d) / 9] };
    }
    const legNear = leg(nearIsStance ? feet[0] : feet[1]);
    const legFar  = leg(nearIsStance ? feet[1] : feet[0]);

    // ---------- draw line ----------
    let dMain = "";
    const dx = Math.max(6, W / 160);
    for (let x = -10; x <= W + 10; x += dx) dMain += (dMain ? "L" : "M") + x.toFixed(1) + "," + Y(x).toFixed(2);
    mainPath.setAttribute("d", dMain);

    // backup: hangs in loops between tapes
    let dB = "";
    for (let i = 0; i < tapes.length - 1; i++) {
      const x0 = tapes[i].x, x1 = tapes[i + 1].x;
      if (x1 < -20 || x0 > W + 20) continue;
      const y0 = Y(x0), y1 = Y(x1), xm = (x0 + x1) / 2;
      const cy = (y0 + y1) / 2 + 2 * drops[i];
      dB += `M${x0.toFixed(1)},${y0.toFixed(2)} Q${xm.toFixed(1)},${cy.toFixed(2)} ${x1.toFixed(1)},${y1.toFixed(2)} `;
    }
    backupPath.setAttribute("d", dB);

    // leash: harness to a ring sliding on the line just behind the walker
    const harness = [hip[0] - 1, hip[1] + 1];
    const rx = s - 26, ry = Y(rx);
    ring.setAttribute("cx", rx); ring.setAttribute("cy", ry + 2.2);
    const lx = (harness[0] + rx) / 2 - 2, ly = Math.max(harness[1], ry) + 12;
    leash.setAttribute("d", `M${harness[0].toFixed(1)},${harness[1].toFixed(1)} Q${lx.toFixed(1)},${ly.toFixed(1)} ${rx.toFixed(1)},${(ry + 2).toFixed(1)}`);

    // ---------- draw figure ----------
    farLeg.setAttribute("points", pts(legFar.pts));
    farFoot.setAttribute("x1", legFar.foot[0]); farFoot.setAttribute("y1", legFar.foot[1]);
    farFoot.setAttribute("x2", legFar.foot[2]); farFoot.setAttribute("y2", legFar.foot[3]);
    farArm.setAttribute("points", pts(far));
    nearLeg.setAttribute("points", pts(legNear.pts));
    nearFoot.setAttribute("x1", legNear.foot[0]); nearFoot.setAttribute("y1", legNear.foot[1]);
    nearFoot.setAttribute("x2", legNear.foot[2]); nearFoot.setAttribute("y2", legNear.foot[3]);
    torso.setAttribute("points", pts([hip, neck]));
    head.setAttribute("cx", headC[0]); head.setAttribute("cy", headC[1]); head.setAttribute("r", CFG.headR);
    nearArm.setAttribute("points", pts(near));

    [hip, legNear.pts[1], legFar.pts[1], legNear.pts[2], legFar.pts[2], near[1], near[2], far[1], far[2]]
      .forEach((pt, i) => { joints[i].setAttribute("cx", pt[0]); joints[i].setAttribute("cy", pt[1]); });
  }

  layout();
  window.addEventListener("resize", layout);
  requestAnimationFrame(frame);

  // preview-only controls
  const sp = document.getElementById("speed"), spv = document.getElementById("speed-val");
  sp.addEventListener("input", () => { speedMul = +sp.value; spv.textContent = sp.value + "×"; });
  document.getElementById("debug").addEventListener("change", e => document.body.classList.toggle("debug", e.target.checked));
  document.getElementById("pause").addEventListener("change", e => { paused = e.target.checked; });
  // for screen recording: ?start=<px> jumps the walker
  const st = new URLSearchParams(location.search).get("start");
  if (st) { startCrossing(+st); s = +st; }
})();
</script>
</body>
</html>
